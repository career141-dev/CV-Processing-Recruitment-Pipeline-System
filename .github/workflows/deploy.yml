name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd ~/career141
            git pull origin main
            docker compose --env-file .env.production -f docker-compose.prod.yml build --no-cache web
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --force-recreate

# Legacy/local LiveKit server configuration.
#
# Production uses infra/livekit.yaml via docker-compose.prod.yml. Credentials
# must be supplied with LIVEKIT_KEYS; never add API secrets to this file.
port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: true

logging:
  level: info

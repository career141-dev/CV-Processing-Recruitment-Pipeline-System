services:
  web:
    build:
      context: .
      args:
        # These are baked in at build time. On your VPS,
        # Compose will automatically read these from .env.production
        - NEXT_PUBLIC_CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL}
        - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    image: career141-prod:latest
    container_name: career141-web
    # ── CRASH FIX 1: Auto-restart if Next.js crashes ──
    restart: unless-stopped
    # We use "expose" instead of "ports" because Caddy will route traffic to it internally.
    # This prevents the app from being accessed directly via the server's IP address.
    ports:
      - "127.0.0.1:3000:3000"
    # Load all server-side secrets at runtime
    env_file:
      - .env.production
    # ── CRASH FIX 2: Memory limit — prevents Next.js from eating all RAM ──
    mem_limit: 1g
    mem_reservation: 256m
    # ── CRASH FIX 4: Log rotation to prevent filling up the VPS disk ──
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: career141-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage:z
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    mem_limit: 2g
    mem_reservation: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  livekit:
    image: livekit/livekit-server:latest
    container_name: career141-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50200:50000-50200/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    mem_limit: 1g
    mem_reservation: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  voice-agent:
    build:
      context: ./agent
    container_name: career141-voice-agent
    restart: unless-stopped
    depends_on:
      - livekit
    env_file:
      - .env.production
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-career141_livekit_key}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-career141_livekit_secret_8f4a1c9e2b7d5a3f60e1d8c2}
    mem_limit: 1g
    mem_reservation: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  qdrant_storage:

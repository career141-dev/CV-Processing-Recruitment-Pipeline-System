# Schema-valid, secret-free baseline for the LiveKit SIP service. Production
# supplies the same fields through SIP_CONFIG_BODY so the Redis password can be
# injected at runtime rather than committed here.
sip_port: 5060
rtp_port: 10000-10100
use_external_ip: true
health_port: 8080
max_active_calls: 2
hide_inbound_port: true
redis:
  address: redis:6379
ws_url: ws://livekit:7880
logging:
  level: info

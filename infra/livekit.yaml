port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: true

redis:
  address: redis:6379

# LIVEKIT_KEYS and LIVEKIT_REDIS_PASSWORD are injected by Compose. Keeping
# credentials out of this tracked file is intentional.
turn:
  enabled: true
  udp_port: 3478
  # 5349 is the TURN/TCP port when HTTPS is terminated on the host proxy.
  # If you later move TLS termination to LiveKit, switch this to 443 and remove
  # external certificate forwarding constraints accordingly.
  tls_port: 5349
  external_tls: true

logging:
  level: info
